<div [class]="getClass()" role="alert">
  @if (alertState === 'loading') {
    <div class="spinner-border text-primary me-2" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  } @else {
    <span class="me-2" aria-hidden="true">⚠</span>
  }
  <span>{{ text }}</span>
</div>
