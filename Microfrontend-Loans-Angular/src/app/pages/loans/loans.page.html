@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Loans..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Loans" ></app-alert>
    }

    @case('success'){
        <app-loans-table [loans]="loans" ></app-loans-table>
    }

}
